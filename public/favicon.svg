<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>N</title>
	<!-- Ink tile, matching the site's ink colour -->
	<rect width="64" height="64" rx="16" fill="#252b2a" />
	<!-- Stems of the N -->
	<rect x="11" y="16" width="8" height="32" rx="2" fill="#fbfaf8" />
	<rect x="31" y="16" width="8" height="32" rx="2" fill="#fbfaf8" />
	<!-- Diagonal as a folded blue ribbon laid over the stems -->
	<path d="M11 16h8l20 32h-8z" fill="#4285F4" />
	<!-- Fold shadows where the ribbon tucks behind each stem -->
	<path d="M11 16h8l-8 4z" fill="#1e5fbf" />
	<path d="M39 48h-8l8-4z" fill="#1e5fbf" />
	<!-- Brand dot, echoing the "nm." monogram in the header -->
	<circle cx="49" cy="44" r="4.5" fill="#4285F4" />
</svg>
